# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   (Kiểm tra tay bởi người kiểm số; đối chiếu với output D1 của src/lab13.py)
#   a) Chia theo yêu cầu: p̄ = 0,725; (1,95996 × √0,39875 + 0,84162 × √0,3975)² ÷ 0,05²
#      = (1,23766 + 0,53063)² ÷ 0,0025 = 1.250,7 → 1.251 yêu cầu mỗi nhóm (code: 1.251) · Khớp
#   b) Theo nhân viên, m = 75: DE = 1 + (75 − 1) × 0,02 = 2,48 ; n = 1.251 × 2,48 = 3.103 mỗi nhóm
#      → 3.103 ÷ 75 = 41,4 → 42 người mỗi nhóm, tổng 84 > 40 người: không đủ người (code: 3.103; 42 người) · Khớp
#   c) 20 nhân viên mỗi nhóm: tối đa c ÷ ICC = 20 ÷ 0,02 = 1.000 < 1.251: không đạt (code: 1.000) · Khớp
#   d) 6 depot mỗi nhóm: tối đa 6 ÷ 0,02 = 300 < 1.251: không đạt (code: 300) · Khớp
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm:
#      20m ≥ 859 × (1 + (m − 1) × 0,02) → 20m ≥ 841,82 + 17,18m → 2,82m ≥ 841,82 → m ≥ 298,5 → m ≥ 299 ;
#      DE = 1 + 298 × 0,02 = 6,96 ; kiểm lại 20 × 299 ÷ 6,96 = 859,2 ≥ 859 (code: 299; 6,96) · Khớp. Power nếu tác động thật là 5 điểm: 0,64.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc song song cùng thời gian tại 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Phân nhóm ngẫu nhiên bằng code (random seed ghi trước), phân tầng theo 12 depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ kinh nghiệm trong depot; giảm bằng cấp quyền theo staff_id và ghi nhận log mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Đã viết trước và đăng ký trong kế hoạch pilot này.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (20 cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận mức chênh phát hiện được là 6 điểm (n = 859/nhóm, m >= 299 yc/người) để đảm bảo 20 cụm/nhóm; nếu tác động thật chỉ 5 điểm thì statistical power giảm xuống 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại toàn bộ là 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang là 3,97%. Ngưỡng dừng: nhóm can thiệp cao hơn đối chứng >= 2 điểm phần trăm hoặc tỷ lệ tuyệt đối vượt quá 6%.

